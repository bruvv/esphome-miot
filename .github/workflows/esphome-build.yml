name: ESPHome compatibility builds

on:
  pull_request:
    paths:
      - ".github/workflows/esphome-build.yml"
      - ".github/scripts/prepare_ci_example.py"
      - "components/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/esphome-build.yml"
      - ".github/scripts/prepare_ci_example.py"
      - "components/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.example }} / ESPHome ${{ matrix.esphome }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.9.1", "2026.10.0"]
        example:
          - "zhimi.humidifier.ca4.yaml"
          - "zhimi.airp.mb4a.yaml"

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "esphome==${{ matrix.esphome }}"

      - name: Prepare example with local MIoT source
        run: |
          python .github/scripts/prepare_ci_example.py \
            --source "config/${{ matrix.example }}" \
            --target ".ci/${{ matrix.example }}"

      - name: Validate example
        run: esphome config ".ci/${{ matrix.example }}"

      - name: Compile firmware
        run: esphome compile ".ci/${{ matrix.example }}"
